# US image-formation parameters (Step 4 calibrates these against real US).
# Consumed by deepussim.us.renderer.RendererParams.
renderer:
  freq_mhz: 5.0             # probe centre frequency
  atten_db_cm_mhz: 0.5      # soft-tissue attenuation coefficient (round-trip applied internally)
  tgc_db_cm: 0.5            # time-gain compensation slope (compensates attenuation with depth)
  reflect_scale: 1.0        # scales interface reflectivity (impedance-gradient -> echo)
  speckle_sigma: 0.5        # lognormal multiplicative speckle std
  gain_db: 0.0              # overall brightness offset
  dynamic_range_db: 50.0    # log-compression window
  seed: 0                   # speckle RNG seed (null = nondeterministic)

# Curvilinear (convex) probe geometry (deepussim.us.reslice.ProbeGeometry).
# Fitted from the real US fan via scripts/fit_us_geometry.py (--us-spacing 0.166112957,
# scans 1/8/15 of the 2026-06-12 collection; apex (440,-262) px, r0=308 r1=917 px,
# fit residual 0.3 px). Same probe/depth as the prior fit (52.5/68.1/101.5, resid 3.1 px).
geometry:
  radius_mm: 51.1          # convex-array radius (virtual apex -> transducer face)
  fov_deg: 69.3            # total sector angle (lateral field of view)
  depth_mm: 101.2          # imaging depth along each beam, from the face outward
  n_lat: 256               # scan lines (image width, px)
  n_ax: 512                # samples per scan line (image height, px)
